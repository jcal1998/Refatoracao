name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Sem serviços de PostgreSQL nem SMTP: a suíte precisa rodar só com a JVM.
      - run: mvn -B verify
